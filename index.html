<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#F4F5F7" />
    <meta name="description" content="Biến tài liệu học thành bộ câu hỏi luyện tập." />
    <title>ciinder</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      try {
        var t = localStorage.getItem('ciinder:theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dem' : 'sang')
        document.documentElement.dataset.theme = t
        if (t === 'dem') document.querySelector('meta[name="theme-color"]').content = '#121416'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
